name: Keep Render Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "RENDER_HEALTHCHECK_URL secret is not set."
            exit 1
          fi

          case "$HEALTHCHECK_URL" in
            */api/v1/health|*/health)
              TARGET_URL="$HEALTHCHECK_URL"
              ;;
            */)
              TARGET_URL="${HEALTHCHECK_URL}api/v1/health"
              ;;
            *)
              TARGET_URL="${HEALTHCHECK_URL}/api/v1/health"
              ;;
          esac

          echo "Pinging $TARGET_URL"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$TARGET_URL"
